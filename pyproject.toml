[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuo"
version = "0.1.0"
description = "The continuity supervisor for AI filmmaking — post-generation drift QC with prescriptive prompt repair."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["continuo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
